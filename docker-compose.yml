# Phase 1 skeleton: backend + MySQL only. No automatic migrations/seed yet —
# that lands in Phase 9 (feature/docker-deploy) per MASTER_PLAN.md Section 8.
services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dhaka_tesla_pool
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "mysql://root:password@mysql:3306/dhaka_tesla_pool"
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
