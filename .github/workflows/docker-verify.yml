name: Docker Compose smoke test

# Verifies `docker compose up` actually brings up a working stack (mysql -> backend migrate/seed
# -> health check) on every push. This is the one piece of Phase 9 (MASTER_PLAN.md Section 8) that
# couldn't be verified locally — no Docker Engine was available in the development environment
# (docs/decisions.md item 21). GitHub Actions' free tier ships Docker preinstalled, so this
# substitutes as the verification method. Smoke test only, not a full CI suite.

on:
  push:
  workflow_dispatch:

jobs:
  docker-compose-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free port 3306 (ubuntu-latest ships with a system MySQL already listening on it)
        run: sudo systemctl stop mysql.service || true

      - name: Build and start the full stack
        run: docker compose up -d --build

      - name: Wait for the backend to report healthy
        run: |
          echo "Waiting for backend health check (mysql -> migrate deploy -> db seed -> server start)..."
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health || echo "000")
            if [ "$status" = "200" ]; then
              echo "Backend healthy after ${i} attempt(s)."
              exit 0
            fi
            echo "Attempt ${i}/30: got HTTP ${status}, retrying in 5s..."
            sleep 5
          done
          echo "Backend never became healthy."
          exit 1

      - name: Verify seed data loaded (GET /api/zones)
        if: always()
        run: |
          curl -sf http://localhost:4000/api/zones | head -c 500
          echo

      # This CI run is real mysql:8, not the MariaDB 10.4 used for local development
      # (docs/decisions.md item 13) — but until now nothing in this workflow actually exercised
      # the concurrency-critical `SELECT ... FOR UPDATE` row-lock path (matchingService.js /
      # rideService.js), only plain reads. This step closes that gap: it pools Nusrat and Rafiq
      # onto the same Tesla concurrently, the exact MASTER_PLAN.md Section 5.2 scenario, which
      # only succeeds if the row-locked seat-claim code actually works against real MySQL 8.
      - name: Exercise pooling + row-locked seat claim against real MySQL 8
        if: always()
        run: |
          set -e
          BANANI=$(curl -sf http://localhost:4000/api/zones | jq -r '.[] | select(.name=="Banani") | .id')
          MOHAKHALI=$(curl -sf http://localhost:4000/api/zones | jq -r '.[] | select(.name=="Mohakhali") | .id')
          GULSHAN=$(curl -sf http://localhost:4000/api/zones | jq -r '.[] | select(.name=="Gulshan") | .id')

          NUSRAT_TOKEN=$(curl -sf -X POST http://localhost:4000/api/auth/login -H "Content-Type: application/json" -d '{"email":"nusrat@dhakateslapool.test","password":"password123"}' | jq -r '.token')
          RAFIQ_TOKEN=$(curl -sf -X POST http://localhost:4000/api/auth/login -H "Content-Type: application/json" -d '{"email":"rafiq@dhakateslapool.test","password":"password123"}' | jq -r '.token')
          JASHIM_TOKEN=$(curl -sf -X POST http://localhost:4000/api/auth/login -H "Content-Type: application/json" -d '{"email":"jashim@dhakateslapool.test","password":"password123"}' | jq -r '.token')

          echo "Requesting Nusrat + Rafiq rides concurrently..."
          curl -sf -X POST http://localhost:4000/api/rides -H "Authorization: Bearer $NUSRAT_TOKEN" -H "Content-Type: application/json" -d "{\"pickupZoneId\":\"$BANANI\",\"destinationZoneId\":\"$MOHAKHALI\",\"seatsRequested\":1}" > /tmp/nusrat.json &
          curl -sf -X POST http://localhost:4000/api/rides -H "Authorization: Bearer $RAFIQ_TOKEN" -H "Content-Type: application/json" -d "{\"pickupZoneId\":\"$BANANI\",\"destinationZoneId\":\"$GULSHAN\",\"seatsRequested\":1}" > /tmp/rafiq.json &
          wait

          echo "Nusrat's ride:"; cat /tmp/nusrat.json; echo
          echo "Rafiq's ride:"; cat /tmp/rafiq.json; echo

          NUSRAT_STATUS=$(jq -r '.status' /tmp/nusrat.json)
          RAFIQ_STATUS=$(jq -r '.status' /tmp/rafiq.json)
          if [ "$NUSRAT_STATUS" != "REQUESTED" ] || [ "$RAFIQ_STATUS" != "REQUESTED" ]; then
            echo "Ride creation failed (expected both REQUESTED)."; exit 1
          fi

          echo "Checking Jashim's driver console shows them pooled together..."
          POOLS=$(curl -sf http://localhost:4000/api/driver/requests -H "Authorization: Bearer $JASHIM_TOKEN")
          echo "$POOLS"
          SEATS=$(echo "$POOLS" | jq -r '.[0].seatsOccupied // empty')
          if [ "$SEATS" != "2" ]; then
            echo "Expected a pool with 2 seats occupied (row-locked seat claim), got: '$SEATS'"
            exit 1
          fi
          echo "Pooling + SELECT ... FOR UPDATE row-locked seat claim confirmed working against real MySQL 8."

      - name: Show container logs (always, for diagnosing failures)
        if: always()
        run: docker compose logs

      - name: Show container status (always)
        if: always()
        run: docker compose ps

      - name: Tear down
        if: always()
        run: docker compose down -v
